<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QC Operations Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#111C3B; --navy2:#1B2A52;
    --ink:#1F2937; --ink-soft:#6B7280; --line:#E7E9EC; --page:#F7F8FA; --card:#FFFFFF;
    --blue:#2563EB; --blue-bg:#E8EFFD;
    --purple:#7C3AED; --purple-bg:#F1EAFD;
    --teal:#0891B2; --teal-bg:#E3F4F8;
    --amber:#D97706; --amber-bg:#FCF1E1;
    --red:#DC2626; --red-bg:#FCE9E9;
    --green:#059669; --green-bg:#E4F5EF;
    --slate:#475569; --slate-bg:#EEF1F4;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--page);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px;}

  /* Slim light header */
  .hdr{background:var(--card);border-bottom:1px solid var(--line);}
  .hdr-inner{max-width:1280px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .hdr-left{display:flex;align-items:center;gap:11px;}
  .hdr-icon{width:32px;height:32px;border-radius:9px;background:rgba(17,28,59,.07);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .hdr h1{margin:0;font-size:16.5px;font-weight:600;letter-spacing:.01em;color:var(--ink);}
  .hdr .sub{font-size:10px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase;margin-top:1px;}
  .savebar{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}

  .tabbar{background:#fff;border-bottom:1px solid var(--line);}
  .tabbar-inner{max-width:1280px;margin:0 auto;padding:0 24px;display:flex;gap:0;}
  .tab{padding:12px 4px;margin-right:24px;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;user-select:none;}
  .tab.active{color:var(--ink);border-bottom-color:var(--navy);}
  .panel{display:none;} .panel.active{display:block;}

  /* Sidebar + main layout */
  .layout{display:flex;gap:18px;align-items:flex-start;margin-top:18px;}
  .sidebar{width:312px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;}
  .main-col{flex:1;min-width:0;}
  @media (max-width:900px){ .layout{flex-direction:column;} .sidebar{width:100%;} }

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;}

  .stats-card{padding:14px;}
  .stats-card .cardtitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:10px;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat-mini{background:var(--page);border-radius:8px;padding:9px 10px;}
  .stat-mini .label{font-size:9px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink-soft);margin-bottom:4px;}
  .stat-mini .value{font-size:17px;font-weight:600;font-family:'Space Grotesk',sans-serif;color:var(--ink);}
  .stat-mini.warn .value{color:var(--red);}

  /* Light calendar */
  .cal-card{overflow:hidden;}
  .cal-nav-lite{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line);}
  .cal-nav-lite .label{font-size:12.5px;font-weight:600;color:var(--ink);}
  .cal-nav-lite button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;padding:2px 7px;border-radius:5px;line-height:1;}
  .cal-nav-lite button:hover{background:var(--page);color:var(--ink);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:8px;gap:2px;}
  .cal-dow{font-size:9px;color:var(--ink-soft);text-align:center;padding:4px 0 6px;font-weight:600;}
  .cal-day{position:relative;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink);cursor:default;}
  .cal-day.out .num{color:#CBD0D6;}
  .cal-day .num{width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
  .cal-day.today .num{background:var(--navy);color:#fff;font-weight:700;}
  .cal-day.overdue-flag .num{box-shadow:inset 0 0 0 1.5px var(--red);}
  .cal-dot{width:4px;height:4px;border-radius:50%;margin-top:1px;}

  .panel-card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}

  .toolbar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:16px 18px 14px;}
  .toolbar2 h3{margin:0 4px 0 0;font-size:15px;}
  .tlabel{font-size:11px;color:var(--ink-soft);}
  .spacer{flex:1;}
  select,input[type=text],input[type=date],input[type=url]{font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);}
  .btn{font-family:inherit;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;}
  .btn:hover{background:var(--page);}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{opacity:.9;}
  .btn.active{background:var(--red-bg);color:var(--red);border-color:var(--red-bg);}

  /* Contained-scroll, fixed-layout table so nothing scrolls horizontally */
  .tablewrap{max-height:min(620px, calc(100vh - 300px));overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line);}
  .tbl{width:100%;border-collapse:collapse;font-size:12.3px;table-layout:fixed;}
  .tbl th{position:sticky;top:0;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);padding:8px 9px;border-bottom:1px solid var(--line);background:#FAFAFB;z-index:1;}
  .tbl td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;border-left:3px solid transparent;overflow:hidden;}
  .tbl td:first-child{border-left-width:3px;}
  .tbl tr:last-child td{border-bottom:none;}
  .tbl tr.overdue td:first-child{border-left-color:var(--red);}
  .tbl tr:hover{background:var(--page);}
  .ellip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .status{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .catpill{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;display:inline-block;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .tbl th[data-key]{cursor:pointer;user-select:none;}
  .tbl th[data-key]:hover{color:var(--ink);}
  .sortarrow{font-size:8px;margin-left:2px;}
  .colfilter{display:inline-block;margin-left:4px;padding:0 3px;border-radius:4px;cursor:pointer;color:var(--ink-soft);}
  .colfilter:hover{background:var(--page);color:var(--ink);}
  .colfilter.active{background:var(--blue-bg);color:var(--blue);}
  .col-filter-menu{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:8px;min-width:160px;max-height:260px;overflow-y:auto;z-index:200;font-size:12.5px;}
  .col-filter-actions{display:flex;gap:10px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line);}
  .col-filter-actions button{background:none;border:none;color:var(--blue);cursor:pointer;font-size:12px;padding:0;text-decoration:underline;}
  .col-filter-group-label{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);margin:6px 0 2px;}
  .col-filter-item{display:flex;align-items:center;gap:6px;padding:3px 2px;white-space:nowrap;cursor:pointer;font-weight:400;color:var(--ink);}
  .col-filter-item input{width:auto;padding:0;}
  .st-open{background:var(--blue-bg);color:var(--blue);}
  .st-progress{background:var(--amber-bg);color:var(--amber);}
  .st-scheduled{background:var(--slate-bg);color:var(--slate);}
  .st-done{background:var(--green-bg);color:var(--green);}
  .rowbtn{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:4px 6px;border-radius:6px;}
  .rowbtn:hover{background:var(--line);color:var(--ink);}
  .linklet{color:var(--blue);text-decoration:none;}

  .empty{padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  .modal-bg{position:fixed;inset:0;background:rgba(17,28,59,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:10;}
  .modal{background:var(--card);border-radius:12px;padding:22px;width:860px;max-width:94vw;box-shadow:0 12px 32px rgba(0,0,0,.2);}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{margin-bottom:12px;}
  .field.full{grid-column:1/-1;}
  .field label{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;}
  textarea{font-family:inherit;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;resize:vertical;min-height:48px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .banner{font-size:12px;background:var(--blue-bg);color:var(--blue);border-radius:8px;padding:8px 12px;margin-bottom:16px;}

  .archtoolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-inner">
    <div class="hdr-left">
      <div class="hdr-icon">&#127970;</div>
      <div>
        <h1>QC Operations Hub</h1>
        <div class="sub">Quality Control Command Center</div>
      </div>
    </div>
    <div class="savebar"><span class="dot"></span><span id="saveStatus">Synced</span></div>
  </div>
</div>
<div class="tabbar">
  <div class="tabbar-inner">
    <div class="tab active" data-tab="tasks">Tasks</div>
    <div class="tab" data-tab="arc">Archive</div>
  </div>
</div>

<div class="wrap" id="app">

  <div class="panel active" id="panel-tasks">
    <div id="recurBanner"></div>

    <div class="layout">
      <div class="sidebar">
        <div class="card stats-card">
          <div class="cardtitle">Overview</div>
          <div class="stats-grid" id="statGrid"></div>
        </div>
        <div class="card cal-card">
          <div class="cal-nav-lite">
            <button id="calPrev">&#8249;</button>
            <span class="label" id="calLabel"></span>
            <button id="calNext">&#8250;</button>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
      </div>

      <div class="main-col">
        <div class="panel-card">
          <div class="toolbar2">
            <h3>Log Entries</h3>
            <button class="btn primary" id="addTaskBtn">+ Add Entry</button>
            <div class="spacer"></div>
            <button class="btn" id="overdueToggle">Show overdue only</button>
            <button class="btn" id="archiveBtn">Archive Closed Entries</button>
            <button class="btn" id="refreshBtn">Refresh</button>
          </div>
          <div class="tablewrap">
            <table class="tbl">
              <colgroup>
                <col style="width:9%"><col style="width:9%"><col style="width:11%">
                <col style="width:7%"><col style="width:7%"><col style="width:9%">
                <col style="width:10%"><col style="width:12%"><col style="width:11%">
                <col style="width:10%"><col style="width:5%">
              </colgroup>
              <thead><tr>
                <th data-key="category">Category<span class="sortarrow"></span><span class="colfilter" data-filter="category">&#8964;</span></th>
                <th data-key="person">Person<span class="sortarrow"></span><span class="colfilter" data-filter="person">&#8964;</span></th>
                <th data-key="date">Date<span class="sortarrow"></span><span class="colfilter" data-filter="date">&#8964;</span></th>
                <th data-key="type">Type<span class="sortarrow"></span><span class="colfilter" data-filter="type">&#8964;</span></th>
                <th>Topic</th><th>Details</th><th>Issues</th><th>Goals / Action items</th>
                <th data-key="due">Due<span class="sortarrow"></span></th>
                <th data-key="status">Status<span class="sortarrow"></span><span class="colfilter" data-filter="status">&#8964;</span></th>
                <th>Link</th>
              </tr></thead>
              <tbody id="entriesBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-arc">
    <div class="archtoolbar">
      <input type="text" id="archSearch" placeholder="Search archive...">
      <div class="spacer"></div>
      <span class="tlabel" id="archCount"></span>
    </div>
    <div class="panel-card">
      <div class="tablewrap">
        <table class="tbl">
          <colgroup>
            <col style="width:8%"><col style="width:8%"><col style="width:10%">
            <col style="width:6.5%"><col style="width:7%"><col style="width:8%">
            <col style="width:9%"><col style="width:12%"><col style="width:10%">
            <col style="width:7.5%"><col style="width:4.5%"><col style="width:9.5%">
          </colgroup>
          <thead><tr>
            <th>Category</th><th>Person</th><th>Date</th><th>Type</th><th>Topic</th><th>Details</th>
            <th>Issues</th><th>Goals / Action items</th><th>Due</th><th>Status</th>
            <th>Link</th><th>Archived</th>
          </tr></thead>
          <tbody id="archBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
</div>

<script>
const CATS = {
  '💬 C&M':'blue', '🚨 ES Tracker':'red', '❓ Clarifications':'amber',
  '🗂️ Projects':'purple', '📚 T&D':'teal', '🗓️ Admin Tasks':'slate'
};
const CAT_HEX = {blue:'#2563EB',red:'#DC2626',amber:'#D97706',purple:'#7C3AED',teal:'#0891B2',slate:'#475569'};
const CAT_BG = {blue:'#E8EFFD',red:'#FCE9E9',amber:'#FCF1E1',purple:'#F1EAFD',teal:'#E3F4F8',slate:'#EEF1F4'};
const CAT_SHORT = {
  '💬 C&M':'C&M', '🚨 ES Tracker':'ES Tracker', '❓ Clarifications':'Clarifications',
  '🗂️ Projects':'Projects', '📚 T&D':'T&D', '🗓️ Admin Tasks':'Admin Tasks'
};
function catColor(c){ return CATS[c] || 'blue'; }
function statusClass(s){
  if(['Completed','Closed','Resolved'].includes(s)) return 'st-done';
  if(s==='In Progress') return 'st-progress';
  if(s==='Scheduled') return 'st-scheduled';
  return 'st-open';
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(){ return 't'+Math.random().toString(36).slice(2,10); }
function effDate(t){ return t.dueDate || t.date; }
function isDone(s){ return ['Completed','Closed','Resolved'].includes(s); }
function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let tasks = [];
let archive = [];
let meta = { lastRecurCheck: null };
let overdueOnly = false;
const today0 = new Date();
let calYear = today0.getFullYear();
let calMonth = today0.getMonth();

async function loadAll(){
  try{ tasks = JSON.parse(localStorage.getItem('qc-tasks') || '[]'); }catch(e){ tasks = []; }
  try{ archive = JSON.parse(localStorage.getItem('qc-archive') || '[]'); }catch(e){ archive = []; }
  try{ meta = JSON.parse(localStorage.getItem('qc-meta') || 'null') || { lastRecurCheck: null }; }catch(e){ meta = { lastRecurCheck: null }; }
}
async function saveTasks(){
  document.getElementById('saveStatus').textContent = 'Saving...';
  localStorage.setItem('qc-tasks', JSON.stringify(tasks));
  document.getElementById('saveStatus').textContent = 'Synced';
}
async function saveArchive(){ localStorage.setItem('qc-archive', JSON.stringify(archive)); }
async function saveMeta(){ localStorage.setItem('qc-meta', JSON.stringify(meta)); }

function fridaysBetween(startISO, endISO){
  const out = [];
  let d = new Date(startISO+'T00:00:00');
  while(d.getDay() !== 5){ d.setDate(d.getDate()+1); }
  const end = new Date(endISO+'T00:00:00');
  while(d <= end){ out.push(d.toISOString().slice(0,10)); d.setDate(d.getDate()+7); }
  return out;
}
function firstOfMonthsBetween(startISO, endISO){
  const out = [];
  let d = new Date(startISO+'T00:00:00');
  d = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(endISO+'T00:00:00');
  while(d <= end){ out.push(d.toISOString().slice(0,10)); d.setMonth(d.getMonth()+1); }
  return out;
}

async function runRecurringCatchUp(){
  const today = todayISO();
  const start = meta.lastRecurCheck || '2026-08-01';
  if(start > today){ return 0; }
  let added = 0;
  for(const dISO of firstOfMonthsBetween(start, today)){
    if(!tasks.some(x=>x.date===dISO && x.type==='Admin Task' && x.topic==='Monthly Report')){
      tasks.push({id:uid(), date:dISO, dueDate:dISO, category:'🗓️ Admin Tasks', type:'Admin Task', topic:'Monthly Report', person:'', details:'', goals:'', issues:'', commendable:'', actionItems:'', status:'Scheduled', link:''});
      added++;
    }
  }
  for(const dISO of fridaysBetween(start, today)){
    if(!tasks.some(x=>x.date===dISO && x.type==='Calibration' && x.topic==='Weekly Calibration')){
      tasks.push({id:uid(), date:dISO, dueDate:dISO, category:'📚 T&D', type:'Calibration', topic:'Weekly Calibration', person:'', details:'', goals:'', issues:'', commendable:'', actionItems:'', status:'Scheduled', link:''});
      added++;
    }
  }
  meta.lastRecurCheck = today;
  if(added>0){ await saveTasks(); }
  await saveMeta();
  return added;
}

function renderStats(){
  const total = tasks.length;
  const open = tasks.filter(t=>['Open','In Progress','Scheduled'].includes(t.status)).length;
  const done = tasks.filter(t=>isDone(t.status)).length;
  const today = todayISO();
  const overdue = tasks.filter(t=>effDate(t) < today && !isDone(t.status)).length;
  const in7 = new Date(); in7.setDate(in7.getDate()+7);
  const in7ISO = in7.toISOString().slice(0,10);
  const dueSoon = tasks.filter(t=>effDate(t)>=today && effDate(t)<=in7ISO && !isDone(t.status)).length;
  const esAll = tasks.filter(t=>t.category==='🚨 ES Tracker');
  const esOpen = esAll.filter(t=>!isDone(t.status)).length;
  const stats = [
    ['Total entries', total, false], ['Open / Pending', open, false], ['Completed', done, false],
    ['Overdue', overdue, overdue>0], ['Due this week', dueSoon, false], ['ES Tracker open', esOpen+' / '+esAll.length, false]
  ];
  document.getElementById('statGrid').innerHTML = stats.map(([l,v,warn])=>
    `<div class="stat-mini${warn?' warn':''}"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
}

function entryRowHtml(t, opts){
  opts = opts || {};
  const today = todayISO();
  const overdue = effDate(t) < today && !isDone(t.status);
  const goalsAction = [t.goals, t.actionItems].filter(Boolean).join(' — ');
  const c = catColor(t.category);
  return `<tr class="${overdue && !opts.archived ? 'overdue' : ''}" ${opts.archived?'':`onclick="editTask('${t.id}')" style="cursor:pointer;"`}>
    <td><span class="catpill" style="background:${CAT_BG[c]};color:${CAT_HEX[c]}" title="${escapeHtml(t.category||'')}">${escapeHtml(CAT_SHORT[t.category]||t.category||'')}</span></td>
    <td><span class="ellip" title="${escapeHtml(t.person||'')}">${escapeHtml(t.person||'')}</span></td>
    <td><span class="ellip">${fmtDate(t.date)}</span></td>
    <td><span class="ellip" title="${escapeHtml(t.type||'')}">${escapeHtml(t.type||'')}</span></td>
    <td><span class="ellip" title="${escapeHtml(t.topic||'')}">${escapeHtml(t.topic||'Untitled')}</span></td>
    <td><span class="ellip" title="${escapeHtml(t.details||'')}">${escapeHtml(t.details||'')}</span></td>
    <td><span class="ellip" title="${escapeHtml(t.issues||'')}">${escapeHtml(t.issues||'')}</span></td>
    <td><span class="ellip" title="${escapeHtml(goalsAction)}">${escapeHtml(goalsAction)}</span></td>
    <td><span class="ellip">${fmtDate(t.dueDate)}</span></td>
    <td><span class="status ${statusClass(t.status)}">${t.status||'Open'}</span></td>
    <td>${t.link?`<a class="linklet" href="${escapeHtml(t.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="${escapeHtml(t.link)}">&#128279;</a>`:''}</td>
    ${opts.archived ? `<td>${t.archivedOn?fmtDate(t.archivedOn):''}</td>` : ''}
  </tr>`;
}

let sortState = {key:'date', dir:'asc'};

function sortTasks(list){
  const {key,dir} = sortState;
  const mul = dir==='asc'?1:-1;
  const val = (t)=>{
    if(key==='due') return effDate(t);
    if(key==='person') return (t.person||'').toLowerCase();
    if(key==='type') return (t.type||'').toLowerCase();
    if(key==='status') return t.status||'';
    if(key==='category') return t.category||'';
    return t.date||'';
  };
  list.sort((a,b)=>{
    const av=val(a), bv=val(b);
    if(av<bv) return -1*mul;
    if(av>bv) return 1*mul;
    return 0;
  });
  // pin overdue to top, like the source app
  const today = todayISO();
  list.sort((a,b)=>{
    const aOver = effDate(a)<today && !isDone(a.status) ? 0 : 1;
    const bOver = effDate(b)<today && !isDone(b.status) ? 0 : 1;
    return aOver-bOver;
  });
  return list;
}

function updateSortHeaderUI(){
  document.querySelectorAll('#panel-tasks .tbl th[data-key]').forEach(th=>{
    const arrow = th.querySelector('.sortarrow');
    if(!arrow) return;
    if(th.dataset.key===sortState.key){ arrow.textContent = sortState.dir==='asc' ? ' ▲' : ' ▼'; th.classList.add('sorted'); }
    else { arrow.textContent=''; th.classList.remove('sorted'); }
  });
}

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let columnFilters = {}; // key -> Set of allowed values (date -> {years:Set, months:Set})
let activeFilterMenu = null;

function distinctTaskValues(key){
  return Array.from(new Set(tasks.map(t=>t[key]||'').filter(v=>v!==''))).sort();
}
function distinctDateParts(){
  const dates = tasks.filter(t=>t.date).map(t=>t.date);
  const years = Array.from(new Set(dates.map(d=>d.slice(0,4)))).sort();
  const months = Array.from(new Set(dates.map(d=>d.slice(5,7)))).sort();
  return {years, months};
}
function closeColumnFilterMenu(){
  if(activeFilterMenu){ activeFilterMenu.remove(); activeFilterMenu=null; }
}
function updateFilterIconState(){
  document.querySelectorAll('#panel-tasks .colfilter').forEach(el=>{
    el.classList.toggle('active', !!columnFilters[el.dataset.filter]);
  });
}
function toggleColumnFilterMenu(ev, key){
  ev.stopPropagation();
  const wasOpenForKey = activeFilterMenu && activeFilterMenu.dataset.key===key;
  closeColumnFilterMenu();
  if(wasOpenForKey) return;
  const menu = document.createElement('div');
  menu.className = 'col-filter-menu';
  menu.dataset.key = key;
  if(key==='date'){
    const parts = distinctDateParts();
    const sel = columnFilters.date || {};
    menu.innerHTML =
      '<div class="col-filter-actions"><button type="button" onclick="event.stopPropagation();setDateFilterAll(true)">All</button><button type="button" onclick="event.stopPropagation();setDateFilterAll(false)">None</button></div>' +
      '<div class="col-filter-group-label">Year</div>' +
      parts.years.map(y=>{
        const checked = !sel.years || sel.years.has(y);
        return `<label class="col-filter-item"><input type="checkbox" data-datepart="year" data-val="${y}" ${checked?'checked':''} onclick="event.stopPropagation()" onchange="onDateFilterCheck()"> ${y}</label>`;
      }).join('') +
      '<div class="col-filter-group-label">Month</div>' +
      parts.months.map(m=>{
        const checked = !sel.months || sel.months.has(m);
        const label = MONTH_NAMES[parseInt(m,10)-1] || m;
        return `<label class="col-filter-item"><input type="checkbox" data-datepart="month" data-val="${m}" ${checked?'checked':''} onclick="event.stopPropagation()" onchange="onDateFilterCheck()"> ${label}</label>`;
      }).join('');
  } else {
    const values = distinctTaskValues(key);
    const selected = columnFilters[key];
    menu.innerHTML =
      `<div class="col-filter-actions"><button type="button" onclick="event.stopPropagation();setColumnFilterAll('${key}',true)">All</button><button type="button" onclick="event.stopPropagation();setColumnFilterAll('${key}',false)">None</button></div>` +
      values.map(v=>{
        const checked = !selected || selected.has(v);
        const label = key==='category' ? (CAT_SHORT[v]||v) : v;
        return `<label class="col-filter-item"><input type="checkbox" data-val="${escapeHtml(v)}" ${checked?'checked':''} onclick="event.stopPropagation()" onchange="onColumnFilterCheck('${key}')"> ${escapeHtml(label)}</label>`;
      }).join('');
  }
  document.body.appendChild(menu);
  const rect = ev.currentTarget.getBoundingClientRect();
  menu.style.top = (window.scrollY+rect.bottom+4)+'px';
  menu.style.left = (window.scrollX+rect.left)+'px';
  activeFilterMenu = menu;
  setTimeout(()=>document.addEventListener('click', closeColumnFilterMenu, {once:true}), 0);
}
function onColumnFilterCheck(key){
  const boxes = document.querySelectorAll('.col-filter-menu input[data-val]');
  const values = distinctTaskValues(key);
  const checked = Array.from(boxes).filter(b=>b.checked).map(b=>b.dataset.val);
  if(checked.length===values.length){ delete columnFilters[key]; } else { columnFilters[key]=new Set(checked); }
  updateFilterIconState();
  renderEntries();
}
function setColumnFilterAll(key, allOn){
  document.querySelectorAll('.col-filter-menu input[data-val]').forEach(b=>{ b.checked=allOn; });
  onColumnFilterCheck(key);
}
function onDateFilterCheck(){
  const parts = distinctDateParts();
  const yearBoxes = document.querySelectorAll('.col-filter-menu input[data-datepart="year"]');
  const monthBoxes = document.querySelectorAll('.col-filter-menu input[data-datepart="month"]');
  const checkedYears = Array.from(yearBoxes).filter(b=>b.checked).map(b=>b.dataset.val);
  const checkedMonths = Array.from(monthBoxes).filter(b=>b.checked).map(b=>b.dataset.val);
  const f = {};
  if(checkedYears.length!==parts.years.length) f.years = new Set(checkedYears);
  if(checkedMonths.length!==parts.months.length) f.months = new Set(checkedMonths);
  if(!f.years && !f.months){ delete columnFilters.date; } else { columnFilters.date = f; }
  updateFilterIconState();
  renderEntries();
}
function setDateFilterAll(allOn){
  document.querySelectorAll('.col-filter-menu input[data-datepart]').forEach(b=>{ b.checked=allOn; });
  onDateFilterCheck();
}

function renderEntries(){
  const today = todayISO();
  let list = tasks.slice();
  if(overdueOnly){ list = list.filter(t => effDate(t) < today && !isDone(t.status)); }
  Object.keys(columnFilters).forEach(key=>{
    const f = columnFilters[key];
    if(key==='date'){
      list = list.filter(t=>{
        const y=(t.date||'').slice(0,4), m=(t.date||'').slice(5,7);
        return (!f.years||f.years.has(y)) && (!f.months||f.months.has(m));
      });
    } else {
      list = list.filter(t=> f.has(t[key]||''));
    }
  });
  list = sortTasks(list);
  document.getElementById('entriesBody').innerHTML = list.length
    ? list.map(t=>entryRowHtml(t,{})).join('')
    : '<tr><td colspan="11" class="empty">No entries match. Add one to get started.</td></tr>';
}

function renderArchive(){
  const q = document.getElementById('archSearch').value.trim().toLowerCase();
  let list = archive.filter(a => !q || JSON.stringify(a).toLowerCase().includes(q));
  list.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  document.getElementById('archCount').textContent = list.length + ' archived';
  document.getElementById('archBody').innerHTML = list.length
    ? list.map(t=>entryRowHtml(t,{archived:true})).join('')
    : '<tr><td colspan="12" class="empty">Nothing archived yet. Mark an entry Completed or Closed to archive it.</td></tr>';
}

function renderMiniCal(){
  document.getElementById('calLabel').textContent = new Date(calYear,calMonth,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const first = new Date(calYear,calMonth,1);
  const start = new Date(first); start.setDate(start.getDate()-start.getDay());
  const last = new Date(calYear,calMonth+1,0);
  const end = new Date(last); end.setDate(end.getDate()+(6-end.getDay()));
  const today = todayISO();
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let d = new Date(start);
  while(d<=end){
    const iso = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const inMonth = d.getMonth()===calMonth;
    const isToday = iso===today;
    const dayTasks = tasks.filter(t=>t.date===iso);
    const overdueHere = dayTasks.some(t=>effDate(t)<today && !isDone(t.status));
    const cats = Array.from(new Set(dayTasks.map(t=>t.category).filter(Boolean)));
    const tip = dayTasks.length ? dayTasks.map(x=>`${x.category||''} ${x.topic||x.type||''}`.trim()).join('; ') : '';
    html += `<div class="cal-day ${inMonth?'':'out'} ${isToday?'today':''} ${overdueHere?'overdue-flag':''}" ${tip?`title="${escapeHtml(tip)}"`:''}>
      <span class="num">${d.getDate()}</span>
      ${cats.length?`<span class="cal-dot" style="background:${CAT_HEX[catColor(cats[0])]}"></span>`:''}
    </div>`;
    d.setDate(d.getDate()+1);
  }
  document.getElementById('calGrid').innerHTML = html;
}

async function archiveDoneTasks(){
  const toArchive = tasks.filter(t=>isDone(t.status));
  if(toArchive.length===0) return;
  toArchive.forEach(t=>archive.push({...t, archivedOn: todayISO()}));
  tasks = tasks.filter(t=>!isDone(t.status));
  await saveTasks();
  await saveArchive();
}

function openModal(existing){
  const t = existing || {id:uid(), date:todayISO(), dueDate:todayISO(), category:Object.keys(CATS)[0], type:'', topic:'', person:'', details:'', goals:'', issues:'', commendable:'', actionItems:'', status:'Open', link:''};
  const isNew = !existing;
  const catOptions = Object.keys(CATS).map(c=>`<option ${c===t.category?'selected':''}>${c}</option>`).join('');
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <h3>${isNew?'Add entry':'Edit entry'}</h3>
        <div class="fgrid">
          <div class="field"><label>Date</label><input type="date" id="f-date" value="${t.date}"></div>
          <div class="field"><label>Due date</label><input type="date" id="f-due" value="${t.dueDate||''}"></div>
          <div class="field"><label>Category</label><select id="f-cat">${catOptions}</select></div>
          <div class="field"><label>Type</label><input type="text" id="f-type" value="${escapeHtml(t.type)}" placeholder="e.g. Coaching, Escalation"></div>
          <div class="field full"><label>Topic / task</label><input type="text" id="f-topic" value="${escapeHtml(t.topic)}"></div>
          <div class="field"><label>Person</label><input type="text" id="f-person" value="${escapeHtml(t.person)}"></div>
          <div class="field"><label>Status</label>
            <select id="f-status">
              ${['Open','In Progress','Scheduled','Completed','Closed'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          <div class="field full"><label>Details</label><textarea id="f-details">${escapeHtml(t.details||'')}</textarea></div>
          <div class="field"><label>Goals</label><textarea id="f-goals">${escapeHtml(t.goals||'')}</textarea></div>
          <div class="field"><label>Issues</label><textarea id="f-issues">${escapeHtml(t.issues||'')}</textarea></div>
          <div class="field"><label>Commendable</label><textarea id="f-commendable">${escapeHtml(t.commendable||'')}</textarea></div>
          <div class="field"><label>Action items</label><textarea id="f-action">${escapeHtml(t.actionItems||'')}</textarea></div>
          <div class="field full"><label>Link</label><input type="url" id="f-link" value="${escapeHtml(t.link||'')}" placeholder="https://..."></div>
        </div>
        <div class="modal-actions">
          ${isNew?'':'<button class="btn" id="deleteBtn" style="margin-right:auto;color:var(--red);">Delete</button>'}
          <button class="btn" id="cancelBtn">Cancel</button>
          <button class="btn primary" id="saveBtn">Save</button>
        </div>
      </div>
    </div>`;
  document.getElementById('cancelBtn').onclick = closeModal;
  document.getElementById('modalBg').onclick = (e)=>{ if(e.target.id==='modalBg') closeModal(); };
  if(!isNew){
    document.getElementById('deleteBtn').onclick = async ()=>{
      tasks = tasks.filter(x=>x.id!==t.id);
      await saveTasks(); closeModal(); renderAll();
    };
  }
  document.getElementById('saveBtn').onclick = async ()=>{
    const updated = {
      id:t.id,
      date:document.getElementById('f-date').value || todayISO(),
      dueDate:document.getElementById('f-due').value || '',
      category:document.getElementById('f-cat').value,
      type:document.getElementById('f-type').value,
      topic:document.getElementById('f-topic').value,
      person:document.getElementById('f-person').value,
      status:document.getElementById('f-status').value,
      details:document.getElementById('f-details').value,
      goals:document.getElementById('f-goals').value,
      issues:document.getElementById('f-issues').value,
      commendable:document.getElementById('f-commendable').value,
      actionItems:document.getElementById('f-action').value,
      link:document.getElementById('f-link').value
    };
    const idx = tasks.findIndex(x=>x.id===t.id);
    if(idx>=0) tasks[idx]=updated; else tasks.push(updated);
    await saveTasks();
    await archiveDoneTasks();
    closeModal();
    renderAll();
  };
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }
function editTask(id){ openModal(tasks.find(t=>t.id===id)); }

function renderAll(){
  renderStats();
  renderEntries();
  renderArchive();
  renderMiniCal();
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
  };
});
document.getElementById('addTaskBtn').onclick = ()=>openModal(null);
document.getElementById('refreshBtn').onclick = renderAll;
document.getElementById('overdueToggle').onclick = (e)=>{
  overdueOnly = !overdueOnly;
  e.target.classList.toggle('active', overdueOnly);
  renderEntries();
};
document.getElementById('archiveBtn').onclick = async ()=>{ await archiveDoneTasks(); renderAll(); };
document.getElementById('archSearch').oninput = renderArchive;
document.querySelectorAll('#panel-tasks .tbl th[data-key]').forEach(th=>{
  th.onclick = ()=>{
    const k = th.dataset.key;
    if(sortState.key===k){ sortState.dir = sortState.dir==='asc'?'desc':'asc'; }
    else { sortState = {key:k, dir:'asc'}; }
    updateSortHeaderUI();
    renderEntries();
  };
});
document.querySelectorAll('#panel-tasks .colfilter').forEach(el=>{
  el.onclick = (ev)=> toggleColumnFilterMenu(ev, el.dataset.filter);
});
updateSortHeaderUI();
updateFilterIconState();
document.getElementById('calPrev').onclick = ()=>{ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderMiniCal(); };
document.getElementById('calNext').onclick = ()=>{ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderMiniCal(); };

(async function init(){
  await loadAll();
  const added = await runRecurringCatchUp();
  await archiveDoneTasks();
  if(added>0){
    document.getElementById('recurBanner').innerHTML = `<div class="banner">Added ${added} recurring entr${added===1?'y':'ies'} (Monthly Report on the 1st, Calibration every Friday) to catch up through today.</div>`;
  }
  renderAll();
})();
</script>
