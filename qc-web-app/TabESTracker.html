  <section id="estracker" class="page">
    <div class="es-split">
      <div class="card es-split-log">
        <h2>Log a New ES Tracker Incident</h2>
        <form id="esForm" onsubmit="submitEsEntry(event)">
          <input type="hidden" id="es_ID">
          <div class="row">
            <div class="field">
              <label>Agent (alias)</label>
              <input type="text" id="es_Agent" list="employeeNames2" required onchange="autofillEmployee(this.value)">
              <datalist id="employeeNames2"></datalist>
            </div>
          </div>
          <div class="row">
            <div class="field"><label>Employee Full Name</label><input type="text" id="es_EmployeeName" required></div>
            <div class="field"><label>Position</label><input type="text" id="es_Position"></div>
          </div>
          <div class="row">
            <div class="field"><label>Order ID</label><input type="number" id="es_OrderID" required></div>
            <div class="field"><label>Incident Date</label><input type="date" id="es_IncidentDate" required></div>
          </div>
          <div class="row">
            <div class="field"><label>Level of Impact</label><select id="es_ImpactLevel"></select></div>
            <div class="field"><label>Error Class</label><select id="es_ErrorClass"></select></div>
          </div>
          <div class="row">
            <div class="field" style="flex:2"><label>Error Category</label><input type="text" id="es_ErrorCategory"></div>
          </div>
          <div class="row">
            <div class="field"><label>Sanction Type</label><input type="text" id="es_SanctionType"></div>
            <div class="field"><label>Violation Category</label><input type="text" id="es_ViolationCategory"></div>
            <div class="field"><label>Client / SN</label><input type="text" id="es_Client"></div>
          </div>
          <div class="row">
            <div class="field" style="flex:2"><label>Feedback / Description</label><textarea id="es_Feedback"></textarea></div>
          </div>
          <div class="row">
            <div class="field" style="flex:2"><label>Other Details</label><textarea id="es_RootCause"></textarea></div>
          </div>
          <button type="submit" class="primary danger" id="esSubmitBtn">Log Incident &amp; Generate PDF</button>
          <button type="button" class="secondary hidden" id="esCancelBtn" onclick="cancelEsEdit()">Cancel</button>
          <button type="button" class="secondary hidden" id="esDeleteBtn" onclick="deleteEsEntry()" style="color:var(--danger)">Delete</button>
          <div id="esMsg" class="msg"></div>
        </form>
      </div>

      <div class="card es-split-tracker">
        <div class="toolbar">
          <h2 style="margin:0">ES Tracker</h2>
          <button class="secondary" onclick="loadEsTable()">Refresh</button>
        </div>
        <p class="muted">Click a row to edit or delete it. New incidents already have their PDF generated on submit. Status is Open with none of the three checked, In Progress with some checked, Completed once all three are checked.</p>
        <div id="esTableWrap"><span class="spinner">Loading…</span></div>
      </div>
    </div>
  </section>
